name: Generate world map assets
description: >-
  Produce the generated map assets the two addons ship: the high-resolution
  art in src/addon/art/WorldMap/ for the Art addon, and the low-resolution art
  in src/addon/client/WorldMap/ for the client, reusing the cached copies when
  the generator has not changed since they were last built. The Fog of War zone
  masks in src/addon/client/ZoneMasks/ are always built from the hand-traced
  PSDs in continent-fog-masks/.

# Two trees, each cached separately, keyed by what it depends on:
#
#   art (mapart-v3-<hash>)      the HD World and continent maps, ~1 GB. A pure
#                               function of the generator, so that is the key.
#   lowres (maplow-v1-<hash>)   the low-resolution maps, ~23 MB. Same key as the
#                               art: one generator run writes both.
#
# The zone masks are not cached. build_zone_masks.py runs in seconds, and a cache
# keyed on its inputs could only ever serve a stale result. Its other output,
# src/addon/client/data/ZoneShapes.lua, is committed, and this action fails when
# the build no longer matches the committed file.
#
# A release that only touches Lua, docs or workflows hits both caches and skips
# the ~40 minute build. Nothing the addons ship is committed anymore, so every
# workflow that packages an addon runs this first, whatever it releases.
#
# GitHub scopes caches by ref: a run on a tag can read caches saved from the
# default branch but not from any other tag. So the copies that *later* releases
# restore have to be saved from main (see
# .github/workflows/generate-world-map-assets.yml and the release workflows). A
# copy saved from a tag still serves its own run, it just costs cache quota and
# is invisible to every other tag.

inputs:
  save:
    description: "Save a freshly generated build to the cache (only useful on main)."
    required: false
    default: "false"

  bypass-cache:
    description: >-
      Skip restoring the caches and regenerate the assets even when valid cache
      entries already exist.
    required: false
    default: "false"

  art:
    description: >-
      Build the HD art (src/addon/art/WorldMap) too. Set to "false" by client
      releases, which do not ship it: a miss then runs the minutes-long
      --lowres-only pass instead of the full ~40 minute one.
    required: false
    default: "true"

outputs:
  cache-hit:
    description: "'true' when the HD and low-res art came from the cache instead of being generated."
    value: ${{ steps.decide.outputs.cache-hit }}
  art-key:
    description: "The art cache key, mapart-v3-<hash>. The hash identifies the generator build."
    value: ${{ steps.key.outputs.art-key }}
  lowres-key:
    description: "The low-res art cache key, maplow-v1-<hash>."
    value: ${{ steps.key.outputs.lowres-key }}

runs:
  using: composite
  steps:
    - name: Compute cache keys
      id: key
      shell: bash
      env:
        HASH: ${{ hashFiles('src/generator/generateHFWM.py', 'src/generator/hfwm/**/*.py', 'src/generator/requirements.txt') }}
      run: .github/scripts/world-map-assets-keys.sh >> "$GITHUB_OUTPUT"

    - name: Delete world map assets caches
      if: inputs.bypass-cache == 'true'
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        KEYS: ${{ steps.key.outputs.art-key }} ${{ steps.key.outputs.lowres-key }}
      run: .github/scripts/delete-world-map-assets-cache.sh

    - name: Restore world map art cache
      id: art
      if: inputs.bypass-cache != 'true' && inputs.art == 'true'
      uses: actions/cache/restore@v5
      with:
        path: src/addon/art/WorldMap
        key: ${{ steps.key.outputs.art-key }}

    - name: Restore low-res map cache
      id: lowres
      if: inputs.bypass-cache != 'true'
      uses: actions/cache/restore@v5
      with:
        path: src/addon/client/WorldMap
        key: ${{ steps.key.outputs.lowres-key }}

    - name: Decide what to generate
      id: decide
      shell: bash
      env:
        WANT_ART: ${{ inputs.art }}
        BYPASS: ${{ inputs.bypass-cache }}
        ART_HIT: ${{ steps.art.outputs.cache-hit }}
        LOWRES_HIT: ${{ steps.lowres.outputs.cache-hit }}
      run: .github/scripts/decide-world-map-assets.sh >> "$GITHUB_OUTPUT"

    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: "3.12"

    - name: Install dependencies
      shell: bash
      run: .github/scripts/install-python-deps.sh

    - name: Resolve game build
      id: pipeline
      shell: bash
      run: python .github/scripts/resolve_game_build.py >> "$GITHUB_OUTPUT"

    # ~460 MB of DB2 exports, WDTs and minimap BLPs pulled from wago.tools.
    # The zone masks read DB2 tables too, so this runs on every build.
    - name: Restore pipeline cache
      uses: actions/cache@v5
      with:
        path: ${{ steps.pipeline.outputs.cache_dir }}
        key: casc-${{ steps.pipeline.outputs.build }}-${{ hashFiles('src/generator/hfwm/config/*.py') }}
        restore-keys: |
          casc-${{ steps.pipeline.outputs.build }}-

    # A full run writes the HD art and, as a by-product, the low-res maps.
    # HD skipped (client releases): the minutes-long low-res-only pass, which
    # also skips Original/ re-downloads the full run already made.
    - name: Generate map art
      if: steps.decide.outputs.art == 'true'
      shell: bash
      run: python src/generator/generateHFWM.py --no-caves --skip-fdid-map
    - name: Generate low-res maps
      if: steps.decide.outputs.art != 'true' && steps.decide.outputs.lowres == 'true'
      shell: bash
      run: python src/generator/generateHFWM.py --lowres-only --no-caves --skip-fdid-map

    # The hand-traced PSDs are the only source of the zone masks and of the
    # table that places them. Always built, never restored from a cache.
    - name: Generate zone masks
      shell: bash
      run: python src/generator/scripts/build_zone_masks.py

    # The committed ZoneShapes.lua must be exactly what the traces produce. A
    # difference means a trace or the script changed without the rebuilt table
    # being committed: fail, rather than ship the two out of step.
    - name: Check ZoneShapes.lua matches the traces
      shell: bash
      run: |
        if ! git diff --quiet -- src/addon/client/data/ZoneShapes.lua; then
          echo "::error::src/addon/client/data/ZoneShapes.lua does not match continent-fog-masks/*-traces.psd. Run python src/generator/scripts/build_zone_masks.py and commit the result."
          git diff -- src/addon/client/data/ZoneShapes.lua
          exit 1
        fi

    # Runs on cache hits too: a bad entry should fail here, not ship.
    - name: Verify world map assets
      shell: bash
      env:
        TREES: ${{ steps.decide.outputs.verify }}
      run: .github/scripts/verify-world-map-assets.sh

    # Only after verification, so a broken build is never cached. Saved only
    # if it was missing: saving an existing key just fails.
    - name: Save world map art cache
      if: inputs.save == 'true' && inputs.art == 'true' && steps.decide.outputs.art == 'true' && steps.art.outputs.cache-hit != 'true'
      uses: actions/cache/save@v5
      with:
        path: src/addon/art/WorldMap
        key: ${{ steps.key.outputs.art-key }}
    - name: Save low-res map cache
      if: inputs.save == 'true' && steps.decide.outputs.lowres == 'true' && steps.lowres.outputs.cache-hit != 'true'
      uses: actions/cache/save@v5
      with:
        path: src/addon/client/WorldMap
        key: ${{ steps.key.outputs.lowres-key }}
