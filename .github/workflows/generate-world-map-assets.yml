name: Generate World Map Assets

# Runs the generate-world-map-assets action, which builds the generated trees the
# addons ship — the HD art (src/addon/art/WorldMap/) and the low-resolution maps
# (src/addon/client/WorldMap/) — and saves them to the Actions cache *from
# main*. That is the only scope a tag-triggered release can read, so every
# release reuses them instead of repeating the ~40 minute generation. See
# .github/actions/generate-world-map-assets for the two cache entries and their
# keys. The Fog of War zone masks are not cached: the action rebuilds them from
# the hand-traced PSDs on every run.
#
#   - weekly: GitHub evicts caches unused for 7 days; a lookup here (a real
#     restore on the weekly run) resets that clock. A miss regenerates.
#   - manual: warm it on demand.
#
# A manual run is on main, so it also saves what it generates to the cache
# scope later releases read.

on:
  schedule:
    - cron: "17 4 * * 0"
  workflow_dispatch:
    inputs:
      bypass-asset-cache:
        description: "Bypass the asset cache and regenerate from scratch."
        required: false
        type: boolean
        default: false
  # Called by publish-art-release-curseforge.yml so the build is jobs of that run.
  workflow_call:
    inputs:
      bypass-asset-cache:
        description: "Bypass the asset cache and regenerate from scratch."
        required: false
        type: boolean
        default: false

permissions:
  contents: read
  actions: write

concurrency:
  group: generate-world-map-assets
  cancel-in-progress: false

jobs:
  cache-check:
    name: Check world map asset cache
    runs-on: ubuntu-latest
    outputs:
      cache-hit: ${{ steps.decide.outputs.cache-hit == 'true' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Compute cache keys
        id: key
        env:
          HASH: ${{ hashFiles('src/generator/generateHFWM.py', 'src/generator/hfwm/**/*.py', 'src/generator/requirements.txt') }}
        run: .github/scripts/world-map-assets-keys.sh >> "$GITHUB_OUTPUT"

      # Only the weekly run downloads the assets, to reset the eviction clock
      # (a real restore is what resets GitHub's 7-day clock). Otherwise (a
      # release calling this, a manual warm-up) this only has to know the
      # entries exist; the job that uses them restores them itself, so
      # downloading them here too just doubles the time.
      - name: Restore world map art cache
        id: art
        if: ${{ github.event_name != 'workflow_dispatch' || !inputs.bypass-asset-cache }}
        uses: actions/cache/restore@v5
        with:
          lookup-only: ${{ github.event_name != 'schedule' }}
          path: src/addon/art/WorldMap
          key: ${{ steps.key.outputs.art-key }}
      - name: Restore low-res map cache
        id: lowres
        if: ${{ github.event_name != 'workflow_dispatch' || !inputs.bypass-asset-cache }}
        uses: actions/cache/restore@v5
        with:
          lookup-only: ${{ github.event_name != 'schedule' }}
          path: src/addon/client/WorldMap
          key: ${{ steps.key.outputs.lowres-key }}

      # One decision from both restore results, so a build only runs when at
      # least one of the two trees is missing.
      - name: Decide whether anything is missing
        id: decide
        env:
          ART_HIT: ${{ steps.art.outputs.cache-hit }}
          LOWRES_HIT: ${{ steps.lowres.outputs.cache-hit }}
        run: .github/scripts/decide-world-map-assets.sh >> "$GITHUB_OUTPUT"

  build:
    name: Generate and cache world map assets
    needs: cache-check
    if: ${{ needs.cache-check.outputs.cache-hit != 'true' || inputs.bypass-asset-cache == true }}
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          # The trace PSDs are LFS files; the zone masks are built from them.
          lfs: true

      - name: Generate world map assets
        uses: ./.github/actions/generate-world-map-assets
        with:
          save: "true"
          bypass-cache: ${{ inputs.bypass-asset-cache }}
