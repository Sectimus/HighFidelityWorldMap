name: "Create Release: Client"

# Creates an official tagged release of the client addon: the version tag, the
# package and the GitHub Release with the zip attached. The package is the Lua
# code, the generated tile tables and cave data, the low-resolution map art
# and the Fog of War zone masks (built by the generate-world-map-assets action;
# none of them are committed). It does not include the high-resolution art
# (the Art addon, "Create Release: Art") or a CHANGELOG. The package step
# itself uploads nowhere else; the last job then starts "Publish Client
# Release to CurseForge" with the new tag. If that fails, re-run it on its own
# and give it the tag.
#
# Two ways in:
#
#   1. Push a tag yourself:  git tag -a v1.0.1 -m v1.0.1 && git push origin v1.0.1
#   2. Actions -> Create Release: Client -> Run workflow, pick patch/minor/major
#      and the tag is created for you.
#
# Prefer option 2.
#
# Option 2 deliberately tags and packages inside this one workflow. A tag pushed
# with GITHUB_TOKEN does not trigger other workflows, so chaining two workflows
# would silently do nothing.
#
# Three jobs, so a failure late on does not redo an earlier part:
#
#   tag      (manual runs only) bumps the version and pushes the tag
#   release  packages and creates the GitHub Release
#   publish  calls "Publish Client Release to CurseForge" as a reusable workflow
#
# If release or publish fails (GitHub outage, ...), fix it and use "Re-run
# failed jobs": the jobs before it are not repeated, and a re-run does not bump
# the version a second time.

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
      - "v[0-9]+.[0-9]+.[0-9]+-*"
  workflow_dispatch:
    inputs:
      bump:
        description: "Which part of the version to bump"
        type: choice
        required: true
        default: patch
        options:
          - patch
          - minor
          - major
      prerelease:
        description: 'Optional suffix, e.g. "beta.1" -> v1.0.1-beta.1. A tag containing "beta" or "alpha" is marked as a pre-release, and is published to that CurseForge channel.'
        type: string
        required: false
        default: ""

permissions:
  contents: write

# Never run two releases at once.
concurrency:
  group: release-addon-client
  cancel-in-progress: false

jobs:
  tag:
    name: Bump version and push tag
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      tag: ${{ steps.bump.outputs.tag }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Bump version and push tag
        id: bump
        env:
          BUMP: ${{ inputs.bump }}
          PRERELEASE: ${{ inputs.prerelease }}
        run: .github/scripts/bump-version.sh

  release:
    name: Package and create GitHub release
    needs: tag
    # tag is skipped on a pushed-tag release; that is fine. A failed tag job is not.
    if: ${{ !cancelled() && needs.tag.result != 'failure' }}
    runs-on: ubuntu-latest
    # A cache miss runs the minutes-long --lowres-only pass, plus the zone
    # masks; a hit restores all three trees.
    timeout-minutes: 60
    env:
      # Empty on a pushed-tag release, where the tag is the triggering ref.
      RELEASE_TAG: ${{ needs.tag.outputs.tag || github.ref_name }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          # Empty on a pushed-tag release, which means the triggering ref.
          ref: ${{ needs.tag.outputs.tag }}
          fetch-depth: 0
          lfs: true

      # Builds the generated trees the client ships: the low-resolution maps
      # and the Fog of War zone masks. The HD art is skipped (art: "false"), so
      # a miss is a minutes-long --lowres-only run, not the ~40 minute full
      # one. Saved only on a manual run (main); a pushed-tag run just reads.
      - name: Generate world map assets
        uses: ./.github/actions/generate-world-map-assets
        with:
          art: "false"
          save: ${{ github.event_name == 'workflow_dispatch' && 'true' || 'false' }}

      # The packager skips git-untracked paths, which includes gitignored ones,
      # so the generated trees would be dropped from the zip. See
      # release-addon-art.yml: --intent-to-add (-N) takes them off that list
      # without committing anything. The Art addon (src/addon/art/) is its own
      # package.
      - name: Stage generated assets
        run: git add -fN src/addon/client/WorldMap src/addon/client/ZoneMasks src/addon/client/data/ZoneShapes.lua

      # The packager would write a CHANGELOG.md into the package. A manual
      # changelog (see .pkgmeta) is read from the checkout instead, so it is
      # used for the upload but never ships.
      - name: Write release notes
        run: .github/scripts/release-notes.sh "$RELEASE_TAG" > .release-notes.md

      # The packager has no tag-prefix option: its changelog uses "the previous
      # tag" among all tags. Hide the Art addon's art-v* series and the retired mapdata-v* tags from it.
      - name: Isolate the v* tag series
        run: .github/scripts/isolate-tag-series.sh art-v mapdata-v

      # The repo's TOC has no Version line; stamp it from the tag (not committed).
      - name: Stamp TOC version
        run: .github/scripts/stamp-toc-version.sh src/addon/client/HighFidelityWorldMap.toc "$RELEASE_TAG"

      # -d: build the zip, upload nothing. The packager's own GitHub upload adds
      # release.json, names the zip after the project and dies on a zip this
      # size (curl runs out of memory), so the Release is made by
      # create-github-release.sh below. CurseForge is
      # publish-client-release-curseforge.yml's job.
      - name: Package
        uses: BigWigsMods/packager@v2
        with:
          args: -d
          # Nothing goes to WoWInterface, so skip the pandoc install.
          pandoc: "false"

      # The Release carries one asset: the addon zip, hfwm-forever-client-v1.2.3.zip.
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: .github/scripts/create-github-release.sh "hfwm-forever-client-${RELEASE_TAG}.zip"

      # Redundant once the GitHub Release exists, but it is the only copy of the
      # zip if the Release upload is what failed.
      - name: Upload package
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: package
          path: .release/*.zip
          if-no-files-found: warn
          retention-days: 7
          # .release is a dot-directory, which the action skips by default.
          include-hidden-files: true
          # The zip is already deflated once; re-deflating it is wasted time.
          compression-level: 0

  publish:
    name: Publish to all marketplaces
    needs: [tag, release]
    # Only once the GitHub Release exists, which publish-client-release-curseforge.yml checks for.
    if: ${{ !cancelled() && needs.release.result == 'success' }}
    # Called, so its jobs are jobs of this run. The tag is the one just created
    # by a manual run, or the pushed tag itself.
    permissions:
      contents: read
      checks: write
    uses: ./.github/workflows/publish-client-release-curseforge.yml
    with:
      tag: ${{ needs.tag.outputs.tag || github.ref_name }}
    secrets:
      CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
